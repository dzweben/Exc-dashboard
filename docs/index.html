.pr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pr-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.pr-star { color: var(--acid); font-size: 1.4rem; }
.pr-text { padding: 0; border: 0; background: none; color: var(--ink); text-align: left; font-size: var(--fs-sm); }
.pr-text:hover { color: var(--acid); }
.pr-day { font-size: var(--fs-2xs); color: var(--ink-3); }
.ex-rows { display: grid; gap: 0; }
.ex-row { --c: var(--ink-3); display: grid; grid-template-columns: minmax(140px, 1.2fr) minmax(0, 1.3fr) minmax(0, 1.3fr) 96px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.ex-row .catdot { background: var(--c); margin-right: 6px; }
.ex-last, .ex-best { display: grid; gap: 2px; min-width: 0; }
.ex-last .num, .ex-best .num { font-size: var(--fs-xs); overflow-wrap: anywhere; }
.ex-best .num { color: var(--acid); }
.spark { color: var(--cyan); display: block; }

/* ------------------------------------------------------------ body */
.body-view { display: grid; gap: 22px; max-width: 900px; }
.bw-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.bw-input { font-family: var(--font-mono); font-size: 1.2rem; width: 140px; }
.bw-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.bw-stat { display: grid; gap: 2px; padding: 10px; border: 2px solid var(--line); background: var(--panel-2); }
.bw-big { font-size: 2.2rem; color: var(--cyan); }
.bw-chart { width: 100%; height: auto; display: block; }
.bw-grid { stroke: var(--line-2); stroke-dasharray: 4 4; }
.bw-axis { fill: var(--ink-3); font-family: var(--font-mono); font-size: 11px; }
.bw-line { fill: none; stroke: var(--cyan); stroke-width: 2.5; }
.bw-dot { fill: var(--acid); }
.bw-list { list-style: none; margin: 0; padding: 0; display: grid; }
.bw-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-sm); }

/* ------------------------------------------------------------ sheets */
.it-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.it-row { display: grid; gap: 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.it-head { display: flex; align-items: center; gap: 8px; }
.it-name { font-size: var(--fs-md); }
.it-del { margin-left: auto; }
.it-input { font-family: var(--font-mono); }
.it-read { font-size: var(--fs-2xs); color: var(--acid); letter-spacing: 0.04em; }
.dr-sec.is-pr { border-color: var(--acid); }
.type-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.type-pick-btn { --c: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border: 2px solid var(--line-2); background: var(--void); color: var(--ink-2); font-family: var(--font-mono); font-size: var(--fs-xs); }
.type-pick-btn .catmark { width: 20px; height: 20px; font-size: 9px; }
.type-pick-btn[aria-pressed='true'] { border-color: var(--c); color: var(--ink); box-shadow: 3px 3px 0 0 var(--c); }
.nw-preview { display: grid; gap: 6px; }
textarea.field { resize: vertical; min-height: 64px; font-family: var(--font-body); }

/* setup rows (types, exercises) */
.setup-rows { display: grid; gap: 6px; }
.setup-row { display: grid; grid-template-columns: auto 44px minmax(0, 1fr) 110px minmax(0, 1.6fr) auto; gap: 8px; align-items: center; }
.setup-row.ex-set-row { grid-template-columns: minmax(0, 1.2fr) 120px 120px minmax(0, 1.6fr); }
.setup-color { padding: 0; height: 34px; width: 44px; }
.setup-row .catmark { width: 26px; height: 26px; font-size: 10px; }

/* ------------------------------------------------------------ phone */
@media (max-width: 720px) {
  .hdr-vitals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hdr-vitals .vital:first-child { grid-column: span 3; }
  .nx-big { font-size: 1.8rem; }
  .cal-grid, .cal-grid.is-week { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .cal-day { min-height: 0; grid-template-columns: 112px minmax(0, 1fr); align-items: start; }
  .cal-grid.is-compact .cal-day { min-height: 0; }
  .cal-day-head { flex-direction: row; }
  .log-grid { grid-template-columns: minmax(0, 1fr); }
  .ex-row { grid-template-columns: minmax(0, 1fr) auto; }
  .ex-last, .ex-best { grid-column: 1 / -1; }
  .ex-spark { grid-row: 1; grid-column: 2; }
  .setup-row { grid-template-columns: auto 44px minmax(0, 1fr); }
  .setup-row > :nth-child(n + 4) { grid-column: 1 / -1; }
  .setup-row.ex-set-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .setup-row.ex-set-row > :first-child, .setup-row.ex-set-row > :last-child { grid-column: 1 / -1; }
  .plan-row { grid-template-columns: auto minmax(0, 1fr); }
  .plan-row-btns { grid-column: 1 / -1; justify-content: flex-start; }
  .bw-stats { grid-template-columns: minmax(0, 1fr); }
  .streak-n { font-size: 3.4rem; }
  .plan-list-row { grid-template-columns: auto auto minmax(0, 1fr); }
  .plan-list-row .faint { grid-column: 1 / -1; }
  .wbar-track { height: 90px; }
}

/* ------------------------------------------------------------ due next (rotation) */
@media (min-width: 1100px) { .ov-due { grid-column: 1 / 13; } .lifts-due { grid-column: 1 / -1; } }
@media (min-width: 720px) and (max-width: 1099px) { .ov-due { grid-column: 1 / -1; } }
.nx.is-sug { --c: var(--cyan); }
.due-wrap { display: grid; gap: 12px; }
.due-areas { display: flex; flex-wrap: wrap; gap: 6px; }
.due-area-chip { --c: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line-2); font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.due-area-chip .catdot { background: var(--c); }
.due-area-chip b { color: var(--ink); }
.due-area-chip.is-stale { border-color: var(--hazard); }
.due-area-chip.is-stale b { color: var(--hazard); }
.due-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.due { --c: var(--ink-3); display: grid; align-content: start; gap: 5px; padding: 10px 12px; border: 2px solid var(--line-2); border-top: 6px solid var(--c); background: var(--panel-2); min-width: 0; }
.due-top { display: flex; justify-content: space-between; gap: 8px; }
.due-area { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--c); }
.due-since { font-size: 10px; color: var(--ink-2); }
.due.is-never .due-since, .due.is-stale .due-since { color: #000; background: var(--hazard); padding: 0 4px; }
.due.is-warm .due-since { color: var(--hazard); }
.due.is-today { opacity: 0.6; }
.due.is-today .due-since { color: var(--acid); }
.due-name { font-family: var(--font-display); font-size: 1.25rem; text-transform: uppercase; line-height: 1; }
.due-line { display: flex; gap: 8px; align-items: baseline; font-size: var(--fs-xs); }
.due-line .is-acid { color: var(--acid); }
.due-goal { font-family: var(--font-scrawl); font-size: var(--fs-sm); color: var(--cyan); line-height: 1.25; }
.due-log { justify-self: start; margin-top: 2px; }
</style>
